<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Web Page</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Interactive Web Page with JavaScript</h1>
    <button id="theme-toggle">🌙 Toggle Dark Mode</button>
  </header>

  <main>
    <section>
      <h2>🎮 Counter Game</h2>
      <p>Click the button to increase your score!</p>
      <button id="count-btn">Click Me</button>
      <p>Score: <span id="count">0</span></p>
    </section>

    <section>
      <h2>❓ FAQ Section</h2>
      <div class="faq-item">
        <h3 class="faq-question">What is JavaScript?</h3>
        <p class="faq-answer hidden">JavaScript makes web pages interactive and dynamic!</p>
      </div>
      <div class="faq-item">
        <h3 class="faq-question">Why learn JavaScript?</h3>
        <p class="faq-answer hidden">Because it powers most of the modern web!</p>
      </div>
    </section>

    <section>
      <h2>📋 Contact Form</h2>
      <form id="contact-form">
        <label>Name:</label>
        <input type="text" id="name" placeholder="Enter your name">
        <small class="error" id="nameError"></small>

        <label>Email:</label>
        <input type="text" id="email" placeholder="Enter your email">
        <small class="error" id="emailError"></small>

        <label>Password:</label>
        <input type="password" id="password" placeholder="Enter your password">
        <small class="error" id="passwordError"></small>

        <button type="submit">Submit</button>
        <p id="form-message"></p>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
